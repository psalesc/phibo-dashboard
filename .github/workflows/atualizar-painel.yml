name: Atualizar painel

on:
  schedule:
    # De hora em hora, das 8h às 20h (Brasília), de segunda a sábado.
    # O cron do GitHub é em UTC (Brasília = UTC-3).
    - cron: '7 11-23 * * 1-6'
  workflow_dispatch: {}   # botão "Run workflow" pra rodar na hora

permissions:
  contents: write   # pra fazer commit do index.html
  id-token: write   # pra entrar no Google sem chave (Workload Identity Federation)

concurrency:
  group: atualizar-painel
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    env:
      TZ: America/Sao_Paulo   # mês corrente e "Atualizado em" no horário de Brasília
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Entrar no Google como a service account (sem chave)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/554455998023/locations/global/workloadIdentityPools/github/providers/phibo-dashboard
          service_account: dashboard-reader@phibo-dashboard-511718.iam.gserviceaccount.com

      - name: Instalar dependências
        run: pip install -r pipeline/requirements.txt

      - name: Baixar as 5 planilhas do Drive
        working-directory: pipeline
        run: python fetch_sheets.py

      - name: Gerar o painel
        working-directory: pipeline
        run: python build_dashboard.py master_latest.xlsx dashboard.html controle_vendas.xlsx

      - name: Publicar no GitHub Pages
        run: |
          cp pipeline/dashboard.html index.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then echo "Sem mudanças."; exit 0; fi
          git commit -m "Atualiza painel — $(date '+%d/%m/%Y %H:%M')"
          git push
